*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff7f8,#fff);color:#4a3a3a}.container{max-width:1100px;margin:auto;padding:28px 18px 50px}h1{text-align:center;color:#b76e79;margin:0 0 6px}.subtitle{text-align:center;color:#8a7373;margin-bottom:24px}.songs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.song-btn{border:1px solid #e7cdd1;background:#fff;border-radius:12px;padding:12px;cursor:pointer;font-size:15px;color:#604c4c}.song-btn:hover,.song-btn.active{background:#f8e3e6;border-color:#c98b95}.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 22px rgba(120,80,80,.08)}.song-title{font-size:24px;font-weight:700;color:#a85f6a;margin-bottom:4px}.artist{color:#806b6b;margin-bottom:14px}#player{width:100%;max-width:800px;aspect-ratio:16/9;margin:0 auto 16px}iframe{width:100%;height:100%;border:0;border-radius:12px}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button.action{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:#b76e79;color:white;font-weight:700}button.action:disabled{background:#ccc;cursor:not-allowed}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.info div{background:#fff7f8;padding:12px;border-radius:10px;text-align:center}.prompt{font-size:21px;font-weight:700;margin-bottom:12px}input{width:100%;padding:13px;border:1px solid #dbc6c9;border-radius:10px;font-size:16px;margin-bottom:10px}.answer{display:none;margin-top:12px;padding:14px;background:#eef8ee;border-radius:10px;color:#35623b;line-height:1.6}#status{text-align:center;margin-top:14px;min-height:24px;font-weight:700}.warning{background:#fff4d9;color:#805f18;padding:12px;border-radius:10px;margin-bottom:14px}@media(max-width:700px){.songs{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr}}</style></head><body><div class="container"><h1>💍 Wedding Million Singer 🎤</h1><div class="subtitle">接亲版 · 听歌猜歌词</div><div class="songs" id="songButtons"></div><div class="card"><div id="warning" class="warning" style="display:none"></div><div class="song-title" id="songTitle">请选择歌曲</div><div class="artist" id="artist"></div><div id="player"></div><div class="controls"><button class="action" id="startBtn" onclick="startRound()" disabled>▶ 开始</button><button class="action" id="stopBtn" onclick="stopRound()" disabled>⏸ 暂停</button><button class="action" id="verifyBtn" onclick="verify()" disabled>🎵 播放验证</button><button class="action" onclick="revealAnswer()">💡 显示答案</button></div><div class="info"><div>开始：<strong id="startTime">00:00</strong></div><div>暂停：<strong id="stopTime">00:00</strong></div><div>验证：<strong id="verifyTime">0 秒</strong></div></div><div id="status"></div></div><div class="card"><div class="prompt" id="prompt">请先选择一首歌</div><input id="answerInput" type="text" placeholder="请输入你认为的下一句歌词" disabled><div class="controls"><button class="action" id="checkBtn" onclick="checkAnswer()" disabled>✅ 检查答案</button></div><div class="answer" id="answerBox"></div></div></div><script>const SONGS=[

];let player,selectedSong=null,stoppedAt=null,verificationStart=null,timer=null;function onYouTubeIframeAPIReady(){player=new YT.Player("player",{videoId:SONGS[0].youtubeId,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{renderSongButtons();selectSong(0)}}})}function renderSongButtons(){document.getElementById("songButtons").innerHTML=SONGS.map((s,i)=>`<button class="song-btn" id="songBtn${i}" onclick="selectSong(${i})">${escapeHtml(s.title)}</button>`).join("")}function selectSong(i){clearInterval(timer);selectedSong=SONGS[i];stoppedAt=null;verificationStart=null;document.querySelectorAll(".song-btn").forEach(b=>b.classList.remove("active"));document.getElementById("songBtn"+i)?.classList.add("active");document.getElementById("songTitle").textContent=selectedSong.title;document.getElementById("artist").textContent=selectedSong.artist;document.getElementById("startTime").textContent=formatTime(selectedSong.startAt);document.getElementById("stopTime").textContent=formatTime(selectedSong.stopAt);document.getElementById("verifyTime").textContent=selectedSong.verifySeconds+" 秒";document.getElementById("prompt").textContent=selectedSong.prompt;document.getElementById("answerInput").value="";document.getElementById("answerBox").style.display="none";document.getElementById("status").textContent="";document.getElementById("startBtn").disabled=false;document.getElementById("stopBtn").disabled=true;document.getElementById("verifyBtn").disabled=true;document.getElementById("checkBtn").disabled=false;document.getElementById("answerInput").disabled=false;let w=document.getElementById("warning");if(!isValidYouTubeId(selectedSong.youtubeId)){w.style.display="block";w.textContent="⚠️ 这首歌的 YouTube Video ID 看起来不完整，请确认。"}else{w.style.display="none";if(player?.loadVideoById){player.loadVideoById({videoId:selectedSong.youtubeId,startSeconds:selectedSong.startAt});player.pauseVideo()}}}function startRound(){if(!selectedSong||!player)return;clearInterval(timer);stoppedAt=null;player.seekTo(selectedSong.startAt,true);player.playVideo();document.getElementById("startBtn").disabled=true;document.getElementById("stopBtn").disabled=false;document.getElementById("verifyBtn").disabled=true;document.getElementById("status").textContent="🎵 播放中……";timer=setInterval(()=>{if(player.getCurrentTime()>=selectedSong.stopAt)stopRound()},200)}function stopRound(){if(!selectedSong||!player)return;clearInterval(timer);stoppedAt=player.getCurrentTime();player.pauseVideo();document.getElementById("stopBtn").disabled=true;document.getElementById("verifyBtn").disabled=false;document.getElementById("status").textContent="⏸ 停！请接歌词！"}function verify(){if(!selectedSong||!player)return;clearInterval(timer);verificationStart=stoppedAt??selectedSong.stopAt;player.seekTo(verificationStart,true);player.playVideo();document.getElementById("verifyBtn").disabled=true;document.getElementById("status").textContent="🎶 验证播放中……";timer=setInterval(()=>{if(player.getCurrentTime()>=verificationStart+selectedSong.verifySeconds){clearInterval(timer);player.pauseVideo();document.getElementById("status").textContent="⏸ 验证结束！";document.getElementById("startBtn").disabled=false}},200)}function checkAnswer(){if(!selectedSong)return;let u=normalize(document.getElementById("answerInput").value),c=normalize(selectedSong.answer);if(!u){document.getElementById("status").textContent="✍️ 先写答案哦！";return}document.getElementById("status").textContent=(u===c||c.includes(u)||u.includes(c))?"🎉 答对了！":"😈 不对，再想想！"}function revealAnswer(){if(!selectedSong)return;let b=document.getElementById("answerBox");b.textContent="正确答案："+selectedSong.answer;b.style.display="block"}function normalize(t){return t.toLowerCase().replace(/[\s，。！？、,.!?'"“”‘’：:；;]/g,"").trim()}function formatTime(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function isValidYouTubeId(id){return /^[A-Za-z0-9_-]{11}$/.test(id)}function escapeHtml(t){return t.replace(/[&<>"']/g,m=>({
