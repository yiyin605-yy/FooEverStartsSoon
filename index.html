<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FooEverStartsSoon</title>
<style>
:root{--pink:#d94673;--bg:#fff8fb;--card:#fff;--text:#33252b;--muted:#806b73;--line:#f0dbe3;--gold:#c89532}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff4f8,#fff);color:var(--text)}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 50px}.hero{text-align:center;padding:12px 0 24px}
h1{margin:0;font-size:clamp(28px,5vw,48px)}.sub{color:var(--muted);margin:8px 0 0}
.layout{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 30px #7b28420d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.song{min-height:72px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;padding:12px;text-align:left;font-weight:700;color:var(--text)}.song:hover,.song.active{border-color:var(--pink);background:#fff0f5}.song small{display:block;color:var(--muted);font-weight:500;margin-top:5px}
#player{width:100%;aspect-ratio:16/9;background:#181818;border-radius:14px;overflow:hidden}.empty{height:100%;display:grid;place-items:center;color:#aaa}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:999px;padding:11px 16px;cursor:pointer;font-weight:700;background:#f3e7eb;color:var(--text)}.btn.primary{background:var(--pink);color:white}.btn.gold{background:#f4e5bf;color:#624b13}
.progress{height:8px;background:#f2e4e8;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--pink);transition:width .15s}
.lyric{font-size:clamp(20px,3vw,30px);line-height:1.6;text-align:center;margin:18px 0;padding:18px;border:2px dashed var(--line);border-radius:16px;min-height:90px}.blank{color:var(--pink);font-weight:800}
.answer{display:none;margin-top:12px;padding:14px;background:#fff8e8;border-radius:12px;border:1px solid #ead9a7}.answer.show{display:block}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:17px;margin-top:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.6}.status{font-weight:700;margin:8px 0}.score{font-size:24px;font-weight:800;color:var(--pink)}
@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>💍 Wedding Edition · 百万大歌星</h1>
    <p class="sub">选一首歌 → 播放 → 音乐突然停 → 填歌词 → 播放验证！</p>
  </div>
  <div class="layout">
    <section class="panel">
      <h2>🎵 选择题目</h2>
      <div id="songGrid" class="grid"></div>
      <p class="hint">题目、YouTube 链接、停止时间和答案都可以在 HTML 顶部的 SONGS 数组里修改。</p>
    </section>
    <section class="panel">
      <h2 id="title">请先选择一首歌</h2>
      <div id="player"><div class="empty">选择题目后载入音乐</div></div>
      <div class="row">
        <button class="btn primary" id="start" disabled>▶ 开始播放</button>
        <button class="btn" id="stop" disabled>⏸ 停在歌词处</button>
        <button class="btn gold" id="verify" disabled>🎤 播放验证</button>
        <button class="btn" id="reveal" disabled>👀 显示答案</button>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="status" id="status">等待选择题目</div>
      <div class="lyric" id="lyric">歌词会显示在这里</div>
      <input id="answerInput" placeholder="把你认为缺少的歌词填在这里…" disabled>
      <div class="answer" id="answer"></div>
      <div class="score" id="score"></div>
    </section>
  </div>
</div>

<script>
/*
  =========================
  只需要修改这里的 10 首歌
  =========================
  videoId: YouTube 视频 ID，例如 https://www.youtube.com/watch?v=ABC123 → ABC123
  stopAt: 音乐自动停下来的秒数
  prompt: 停止时显示的歌词题目；用 _____ 表示空白
  answer: 正确歌词（建议由婚礼策划者自行填写）
*/
const SONGS = [
 {title:"第 1 首 ｜Malay Love Song",artist:"请替换",videoId:"D5Z05NuMOjQ",stopAt:55,prompt:"这一句歌词是：_____。",answer:"Cintaku bukan di atas kertas, Cintakugetaran yang sama Tak perlu dipaksa, Tak perlu dicari, Kerna ku yakin ada jawabnya"},
 {title:"第 2 首",artist:"",videoId:"",stopAt:20,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 3 首",artist:"",videoId:"",stopAt:22,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 4 首",artist:"",videoId:"",stopAt:19,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 5 首",artist:"",videoId:"",stopAt:25,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 6 首",artist:"",videoId:"",stopAt:21,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 7 首",artist:"",videoId:"",stopAt:23,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 8 首",artist:"",videoId:"",stopAt:20,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 9 首",artist:"",videoId:"",stopAt:24,prompt:"这一句歌词是：_____。",answer:""},
 {title:"第 10 首",artist:"",videoId:"",stopAt:18,prompt:"这一句歌词是：_____。",answer:""}
];

let player=null,current=-1,timer=null,stoppedAt=0,playingRound=false;

const $=id=>document.getElementById(id);
function renderSongs(){
  $("songGrid").innerHTML="";
  SONGS.forEach((s,i)=>{
    const b=document.createElement("button"); b.className="song"; b.type="button";
    b.innerHTML=`${s.title}<small>${s.artist||"点击开始"}</small>`;
    b.addEventListener("click",()=>selectSong(i)); $("songGrid").appendChild(b);
  });
}
function loadAPI(){
  const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
}
window.onYouTubeIframeAPIReady=function(){ if(current>=0) createPlayer(); };
function selectSong(i){
  clearInterval(timer); current=i; stoppedAt=0; playingRound=false;
  document.querySelectorAll(".song").forEach((x,n)=>x.classList.toggle("active",n===i));
  const s=SONGS[i]; $("title").textContent=s.title; $("status").textContent="准备播放";
  $("lyric").innerHTML=s.prompt.replace("_____","<span class='blank'>_____</span>");
  $("answer").className="answer"; $("answer").textContent=""; $("score").textContent="";
  $("answerInput").value=""; $("answerInput").disabled=false;
  $("start").disabled=!s.videoId; $("stop").disabled=!s.videoId; $("verify").disabled=!s.videoId; $("reveal").disabled=!s.answer;
  if(!window.YT){ $("player").innerHTML="<div class='empty'>正在加载 YouTube 播放器…</div>"; return; }
  createPlayer();
}
function createPlayer(){
  const s=SONGS[current]; if(!s.videoId) return;
  if(player) player.destroy();
  $("player").innerHTML="<div id='yt'></div>";
  player=new YT.Player("yt",{width:"100%",height:"100%",videoId:s.videoId,
    playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ $("status").textContent="已准备好"; }}
  });
}
function startRound(){
  const s=SONGS[current]; if(!player)return;
  stoppedAt=0; playingRound=true; $("status").textContent=`播放中 · ${s.stopAt} 秒自动停止`;
  player.seekTo(0,true); player.playVideo();
  clearInterval(timer); timer=setInterval(()=>{
    if(player && player.getCurrentTime()>=s.stopAt){ stopRound(); }
    if(player){ const d=player.getDuration()||1; $("bar").style.width=Math.min(100,player.getCurrentTime()/d*100)+"%"; }
  },100);
}
function stopRound(){
  if(!player)return; clearInterval(timer); stoppedAt=player.getCurrentTime();
  player.pauseVideo(); playingRound=false; $("status").textContent="🛑 停！现在填写歌词！";
}
function verify(){
  if(!player)return; const s=SONGS[current]; $("status").textContent="🎤 正在播放验证…";
  player.seekTo(stoppedAt||s.stopAt,true); player.playVideo();
  setTimeout(()=>{if(player)player.pauseVideo();},7000);
  checkAnswer();
}
function checkAnswer(){
  const a=$("answerInput").value.trim().replace(/\s/g,"").toLowerCase();
  const correct=(SONGS[current].answer||"").trim().replace(/\s/g,"").toLowerCase();
  if(!correct || !a)return;
  $("score").textContent=a===correct?"🎉 答对了！":"😈 不对，再想想！";
}
function reveal(){
  const s=SONGS[current]; $("answer").textContent="正确歌词："+s.answer; $("answer").className="answer show";
}
$("start").addEventListener("click",startRound); $("stop").addEventListener("click",stopRound);
$("verify").addEventListener("click",verify); $("reveal").addEventListener("click",reveal);
$("answerInput").addEventListener("input",checkAnswer);
renderSongs(); loadAPI();
</script>
</body>
</html>
